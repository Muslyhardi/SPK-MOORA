<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SPK MOORA</title>

    <!-- CSS -->

    <link rel="stylesheet"
          href="assets/css/login.css">

    <link rel="stylesheet"
          href="assets/css/layout.css">

    <link rel="stylesheet"
          href="assets/css/dashboard.css">

    <link rel="stylesheet"
          href="assets/css/karyawan.css">

    <link rel="stylesheet"
          href="assets/css/penilaian.css">

    <link rel="stylesheet"
          href="assets/css/ranking.css">

</head>

<body>

    <!-- LOGIN -->

    <div id="loginPage">

        <div class="login-box">

            <h1>Login</h1>

            <p>
                Silakan masuk untuk melanjutkan
            </p>

            <p
                style="
                    margin-top:10px;
                    color:#666;
                    font-size:14px;
                "
            >
                User / Password :
                <b>admin / 1234</b>
            </p>

            <input
                type="text"
                id="username"
                placeholder="Username">

            <input
                type="password"
                id="password"
                placeholder="Password">

            <button onclick="login()">
                Login
            </button>

        </div>

    </div>

    <!-- APP -->

    <div id="app">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="logo">

                <h2>SPK MOORA</h2>

                <span>
                    Sistem Pendukung Keputusan
                </span>

            </div>

            <nav>

                <button
                    id="menu-dashboard"
                    onclick="loadPage('dashboard')">

                    Dashboard

                </button>

                <button
                    id="menu-karyawan"
                    onclick="loadPage('karyawan')">

                    Data Karyawan

                </button>

                <button
                    id="menu-penilaian"
                    onclick="loadPage('penilaian')">

                    Data Penilaian

                </button>

                <button
                    id="menu-kriteria"
                    onclick="loadPage('kriteria')">

                    Kriteria

                </button>

                <button
                    id="menu-ranking"
                    onclick="loadPage('ranking')">

                    Ranking MOORA

                </button>

            </nav>

            <button
                class="logout-btn"
                onclick="logout()">

                Logout

            </button>

        </aside>

        <!-- MAIN -->

        <main class="main-content">

            <div class="topbar">

                <h2 id="pageTitle">

                    Dashboard

                </h2>

                <div class="admin-badge">

                    Admin

                </div>

            </div>

            <div id="pageContainer">

            </div>

        </main>

    </div>

    <!-- JS -->

    <script src="assets/js/config.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/dashboard.js"></script>
    <script src="assets/js/karyawan.js"></script>
    <script src="assets/js/penilaian.js"></script>
    <script src="assets/js/ranking.js"></script>
    <script src="assets/js/kriteria.js"></script>

</body>

</html>
