<div class="form-card">

    <h2>Tambah Karyawan</h2>

    <div class="form-row">

        <input
            type="text"
            id="namaKaryawan"
            placeholder="Masukkan Nama Karyawan">

        <input
            type="text"
            id="jabatanKaryawan"
            placeholder="Masukkan Jabatan">

        <button
            onclick="tambahKaryawan()">

            Tambah Karyawan

        </button>

    </div>

</div>

<div class="table-card">

    <table class="main-table">

        <thead>

            <tr>

                <th>ID</th>

                <th>Nama</th>

                <th>Jabatan</th>

                <th>Aksi</th>

            </tr>

        </thead>

        <tbody id="karyawanTable">

        </tbody>

    </table>

</div>
